<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Shadow Example</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

/* Navigation Bar */
nav{
    background:#1e3a8a;
    color:white;
    padding:18px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

/* Hero Section */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    width:350px;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.card h1{
    color:#1e3a8a;
    margin-bottom:15px;
    text-shadow:2px 2px 5px gray;
}

.card p{
    color:#555;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
}

input:focus{
    box-shadow:0 0 8px royalblue;
    border-color:royalblue;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
}

footer{
    text-align:center;
    padding:15px;
    background:#1e3a8a;
    color:white;
    box-shadow:0 -4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<nav>
    <h2>ShadowWeb</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<div class="hero">

<div class="card">
    <h1>Welcome Back</h1>

    <p>Login to continue</p>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button>Login</button>
</div>

</div>

<footer>
    © Madan.
</footer>

</body>
</html>
