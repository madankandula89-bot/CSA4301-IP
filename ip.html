<!DOCTYPE html>
<html>
<head>
<title>Welcome to My Website</title>

<style>
body{
    background: #f5f5dc;
    font-family: Cambria;
    font-size: 14px;
    text-align: center;
    margin: 0;
    border-left: 12px solid #0066cc;
    border-right: 12px solid #0066cc;
}

.container{
    width: 80%;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px gray;
}

h1{
    color: #0066cc;
}

marquee{
    color: white;
    background: #0066cc;
    padding: 8px;
    border-radius: 5px;
}

.grid{
    display: grid;
    grid-template-columns: auto auto;
    gap: 15px;
    margin-top: 20px;
}

.box{
    background: #e6f2ff;
    border: 2px solid #0066cc;
    padding: 20px;
    border-radius: 10px;
}

button{
    margin-top: 20px;
    background: #0066cc;
    color: white;
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
}

button:hover{
    background: #004d99;
}
</style>

</head>

<body>

<div class="container">

<h1>Welcome to My Website</h1>

<marquee>🌐 Welcome to My Stylish Website 🌐</marquee>

<div class="grid">
    <div class="box">HTML</div>
    <div class="box">CSS</div>
    <div class="box">Grid Layout</div>
    <div class="box">Web Design</div>
</div>

<button>Explore</button>

</div>

</body>
</html>
